<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cassette XOXO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f7e4d3;
    --coral: #e8632c;
    --magenta: #e63462;
    --mustard: #f2a93b;
    --teal: #2c5f5b;
    --lavender: #c9a4dd;
    --ink: #241c16;
    --paper: #fbf1e6;
    --muted: #7a6b5c;
    --border-soft: rgba(36,28,22,0.12);
    --shadow-soft: rgba(36,28,22,0.08);
  }

  html[data-theme="dark"] {
    --cream: #1c1410;
    --coral: #f07a45;
    --magenta: #ef5b81;
    --mustard: #f2b25a;
    --teal: #4d8f89;
    --lavender: #cba6de;
    --ink: #f3e6d8;
    --paper: #2a201a;
    --muted: #b7a493;
    --border-soft: rgba(245,234,222,0.14);
    --shadow-soft: rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    background-image:
      radial-gradient(circle at 8% 12%, rgba(232,99,44,0.18), transparent 40%),
      radial-gradient(circle at 92% 8%, rgba(44,95,91,0.16), transparent 38%),
      radial-gradient(circle at 85% 92%, rgba(230,52,98,0.14), transparent 42%);
    font-family: 'Space Grotesk', sans-serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 18px 60px;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .site-header {
    width: 100%;
    max-width: 720px;
    margin-bottom: 24px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 28px var(--shadow-soft);
  }

  .header-img {
    display: block;
    width: 100%;
    height: 220px;
    object-fit: cover;
    object-position: center 30%;
  }

  .topbar {
    width: 100%;
    max-width: 620px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-bottom: 8px;
  }

  .site-footer {
    margin-top: 36px;
    font-size: 0.82rem;
    color: var(--muted);
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .site-footer a {
    color: var(--teal);
    font-weight: 600;
    text-decoration: none;
  }

  .site-footer a:hover {
    text-decoration: underline;
  }

  @media (max-width: 480px) {
    .header-img { height: 150px; }
  }

  .icon-btn {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 0.8rem;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--paper);
    color: var(--ink);
    border: 2px solid var(--border-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }

  .icon-btn:hover { border-color: var(--teal); }
  .icon-btn:active { transform: scale(0.96); }

  .hero {
    text-align: center;
    margin-bottom: 28px;
    position: relative;
  }

  .hero .blob {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    width: 240px;
    height: 90px;
    background: var(--mustard);
    opacity: 0.5;
    filter: blur(2px);
    border-radius: 60% 40% 55% 45% / 50% 60% 40% 50%;
    z-index: 0;
  }

  h1 {
    position: relative;
    z-index: 1;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 2.4rem;
    margin: 0;
    color: var(--ink);
    letter-spacing: -0.5px;
  }

  h1 span {
    color: var(--magenta);
  }

  .subtitle {
    position: relative;
    z-index: 1;
    margin-top: 6px;
    font-size: 0.95rem;
    color: var(--muted);
  }

  .panel {
    width: 100%;
    max-width: 620px;
    background: var(--paper);
    border-radius: 24px;
    padding: 22px;
    box-shadow: 0 14px 0 -6px var(--shadow-soft), 0 2px 10px var(--shadow-soft);
    border: 2px solid var(--border-soft);
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }

  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  input[type="text"] {
    flex: 1;
    min-width: 200px;
    padding: 13px 18px;
    border-radius: 999px;
    border: 2px solid var(--border-soft);
    background: #fff;
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.15s ease, background-color 0.2s ease;
  }

  html[data-theme="dark"] input[type="text"] {
    background: #34281f;
    color: var(--ink);
  }

  input[type="text"]::placeholder {
    color: var(--muted);
    opacity: 0.8;
  }

  input[type="text"]:focus {
    border-color: var(--coral);
  }

  button {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: transform 0.1s ease, filter 0.15s ease;
  }

  button:active { transform: scale(0.96); }

  .btn-primary {
    padding: 13px 26px;
    border-radius: 999px;
    background: var(--coral);
    color: #fff;
    font-size: 0.95rem;
    white-space: nowrap;
  }

  .btn-primary:hover { filter: brightness(1.08); }

  .cassette-frame {
    position: relative;
    background: var(--ink);
    border-radius: 18px;
    padding: 14px;
  }

  html[data-theme="dark"] .cassette-frame {
    background: #0f0b08;
  }

  .reel-row {
    display: flex;
    justify-content: space-between;
    padding: 0 6px 10px;
  }

  .reel {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--mustard);
    border: 3px solid rgba(255,255,255,0.15);
  }

  .reel:nth-child(2) { background: var(--magenta); }

  .player-wrap {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
  }

  #player { width: 100%; height: 100%; }

  .controls-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .btn-pill {
    padding: 11px 20px;
    border-radius: 999px;
    background: var(--paper);
    color: var(--ink);
    border: 2px solid var(--border-soft);
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  html[data-theme="dark"] .btn-pill,
  html[data-theme="dark"] .icon-btn {
    background: #34281f;
  }

  .btn-pill:hover { border-color: var(--teal); }

  .speed-toggle {
    background: var(--teal);
    color: #fff;
    border: 2px solid var(--teal);
    min-width: 68px;
    justify-content: center;
  }

  .speed-toggle.active {
    background: var(--magenta);
    border-color: var(--magenta);
  }

  .hint {
    max-width: 620px;
    text-align: center;
    color: var(--muted);
    font-size: 0.82rem;
    margin-top: 18px;
    line-height: 1.5;
  }

  .hint strong {
    color: var(--teal);
  }

  @media (max-width: 480px) {
    h1 { font-size: 1.9rem; }
    .topbar { justify-content: center; }
  }
</style>
</head>
<body>

<header class="site-header">
  <img src="https://i.pinimg.com/1200x/7e/21/8c/7e218c0b3206dcd89f72f0ff5f1a0422.jpg" alt="Painted cassette tapes" class="header-img">
</header>

<div class="topbar">
  <button class="icon-btn" id="langBtn" onclick="toggleLang()">EN</button>
  <button class="icon-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
</div>

<div class="hero">
  <div class="blob"></div>
  <h1>Cassette<span> </span>XOXO</h1>
  <p class="subtitle" data-i18n="subtitle">pega tu video y déjalo sonar una y otra vez</p>
</div>

<div class="panel">
  <div class="input-row">
    <input id="urlInput" type="text" data-i18n-placeholder="placeholder" placeholder="Pega la URL o el ID del video de YouTube">
    <button class="btn-primary" data-i18n="load" onclick="loadVideo()">Cargar</button>
  </div>

  <div class="cassette-frame">
    <div class="reel-row">
      <div class="reel"></div>
      <div class="reel"></div>
    </div>
    <div class="player-wrap">
      <div id="player"></div>
    </div>
  </div>

  <div class="controls-row">
    <button class="btn-pill" data-i18n="restart" onclick="restart()">⏮ reiniciar</button>
    <button class="btn-pill" data-i18n="pause" onclick="togglePlay()">⏯ pausa</button>
    <button class="btn-pill speed-toggle" id="speedBtn" onclick="toggleSpeed()">1x</button>
  </div>
</div>

<p class="hint" id="hintText">
  Pega el link completo o solo el ID del video. Una vez cargado, se repite automáticamente sin límite.
  Toca el botón <strong>1x</strong> para ver el video a doble velocidad.
</p>

<footer class="site-footer">
  <span data-i18n="madeBy">made by</span>
  <a href="https://github.com/noaa01100001" target="_blank" rel="noopener noreferrer">@noaa01100001</a>
</footer>

<script>
  const dict = {
    es: {
      subtitle: "pega tu video y déjalo sonar una y otra vez",
      placeholder: "Pega la URL o el ID del video de YouTube",
      load: "Cargar",
      restart: "⏮ reiniciar",
      pause: "⏯ pausa",
      play: "⏯ reproducir",
      hint: 'Pega el link completo o solo el ID del video. Una vez cargado, se repite automáticamente sin límite. Toca el botón <strong>1x</strong> para ver el video a doble velocidad.',
      alertInvalid: "No pude reconocer un ID de video válido. Revisa el link.",
      langToggle: "EN",
      themeLight: "🌙",
      themeDark: "☀️",
      madeBy: "hecho por"
    },
    en: {
      subtitle: "paste your video and let it play on repeat",
      placeholder: "Paste the YouTube video URL or ID",
      load: "Load",
      restart: "⏮ restart",
      pause: "⏯ pause",
      play: "⏯ play",
      hint: 'Paste the full link or just the video ID. Once loaded, it loops automatically with no limit. Tap the <strong>1x</strong> button to watch at double speed.',
      alertInvalid: "Couldn't recognize a valid video ID. Check the link.",
      langToggle: "ES",
      themeLight: "🌙",
      themeDark: "☀️",
      madeBy: "made by"
    }
  };

  let currentLang = 'en';
  let currentTheme = 'light';
  let isPlaying = false;

  function applyLang() {
    const t = dict[currentLang];
    document.documentElement.lang = currentLang;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (key === 'pause') {
        el.textContent = isPlaying ? t.pause : t.play;
      } else {
        el.textContent = t[key];
      }
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const key = el.getAttribute('data-i18n-placeholder');
      el.placeholder = t[key];
    });
    document.getElementById('hintText').innerHTML = t.hint;
    document.getElementById('langBtn').textContent = t.langToggle;
  }

  function toggleLang() {
    currentLang = currentLang === 'es' ? 'en' : 'es';
    applyLang();
  }

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', currentTheme);
    const t = dict[currentLang];
    document.getElementById('themeBtn').textContent = currentTheme === 'light' ? t.themeLight : t.themeDark;
  }

  function toggleTheme() {
    currentTheme = currentTheme === 'light' ? 'dark' : 'light';
    applyTheme();
  }

  let player;
  let isDoubleSpeed = false;

  function extractId(input) {
    input = input.trim();
    const idMatch = input.match(/(?:v=|\/embed\/|\.be\/|\/v\/|shorts\/)([a-zA-Z0-9_-]{11})/);
    if (idMatch) return idMatch[1];
    if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
    return null;
  }

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      height: '100%',
      width: '100%',
      videoId: '',
      playerVars: {
        rel: 0,
        modestbranding: 1
      },
      events: {
        'onStateChange': onPlayerStateChange
      }
    });
  }

  function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.ENDED) {
      player.seekTo(0);
      player.playVideo();
    }
    if (event.data === YT.PlayerState.PLAYING) {
      isPlaying = true;
      applySpeed();
      applyLang();
    }
    if (event.data === YT.PlayerState.PAUSED) {
      isPlaying = false;
      applyLang();
    }
  }

  function loadVideo() {
    const raw = document.getElementById('urlInput').value;
    const id = extractId(raw);
    if (!id) {
      alert(dict[currentLang].alertInvalid);
      return;
    }
    if (player && player.loadPlaylist) {
      player.loadPlaylist({ listType: 'playlist', playlist: id, index: 0, loop: 1 });
    }
  }

  function restart() {
    if (player && player.seekTo) player.seekTo(0);
  }

  function togglePlay() {
    if (!player) return;
    const state = player.getPlayerState();
    if (state === YT.PlayerState.PLAYING) {
      player.pauseVideo();
    } else {
      player.playVideo();
    }
  }

  function toggleSpeed() {
    isDoubleSpeed = !isDoubleSpeed;
    const btn = document.getElementById('speedBtn');
    btn.textContent = isDoubleSpeed ? '2x' : '1x';
    btn.classList.toggle('active', isDoubleSpeed);
    applySpeed();
  }

  function applySpeed() {
    if (!player || !player.setPlaybackRate) return;
    player.setPlaybackRate(isDoubleSpeed ? 2 : 1);
  }

  applyLang();
  applyTheme();
</script>

<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
