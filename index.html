<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cassette XOXO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cassette-style.css">
  <link rel="icon" type="image/png" href="https://images.vexels.com/media/users/3/270790/isolated/preview/098f64bf130dca681f9a8cc741e15ee0-old-cassette-icon.png">

</head>
<body>

<!-- Logo -->
<header class="site-header">
  <img src="https://i.pinimg.com/1200x/7e/21/8c/7e218c0b3206dcd89f72f0ff5f1a0422.jpg" alt="Painted cassette tapes" class="header-img">
  <div class="hero-overlay">
    <div class="blob"></div>
    <h1>Cassette<span> </span>XOXO</h1>
  </div>
</header>

<div class="topbar">
  <p class="subtitle" data-i18n="subtitle">pega tu video y déjalo sonar una y otra vez</p>
  <button class="icon-btn" id="langBtn" onclick="toggleLang()">EN</button>
  <button class="icon-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
</div>

<div class="panel">
  <div class="input-row">
    <input id="urlInput" type="text" data-i18n-placeholder="placeholder" placeholder="Pega la URL o el ID del video de YouTube">
    <button class="btn-primary" data-i18n="load" onclick="loadVideo()">Cargar</button>
  </div>

  <div class="cassette-frame">
    <div class="reel-row">
      <div class="reel"></div>
      <div class="reel"></div>
    </div>
    <div class="player-wrap">
      <div id="player"></div>
    </div>
  </div>

  <div class="controls-row">
    <button class="btn-pill" data-i18n="restart" onclick="restart()">⏮ reiniciar</button>
    <button class="btn-pill" data-i18n="pause" onclick="togglePlay()">⏯ pausa</button>
    <button class="btn-pill speed-toggle" id="speedBtn" onclick="toggleSpeed()">1x</button>
  </div>
</div>

<p class="hint" id="hintText">
  Pega el link completo o solo el ID del video. Una vez cargado, se repite automáticamente sin límite.
  <br>
  Toca el botón <strong>1x</strong> para ver el video a doble velocidad.
</p>

<footer class="site-footer">
  <div class="footer-content">
    <span data-i18n="madeBy">made by</span>
    <a href="https://github.com/noaa01100001" target="_blank" rel="noopener noreferrer">@noaa01100001</a>
    <span class="footer-divider">•</span>
    <span data-i18n="footerRights">v2.0 © 2026. All rights reserved.</span>
  </div>
</footer>

<script src="cassette-script.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
